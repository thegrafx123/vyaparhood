# Minimal Supabase CLI config. `supabase link --project-ref <ref>` points
# the CLI at the dev or prod project before `db push` / `functions deploy`.
project_id = "vyaparhood"

# Called by pg_cron with a shared secret, not a user login.
[functions.purge-deleted-accounts]
verify_jwt = false

[auth.sms.test_otp]
"+917624828905" = "123456"
[functions.expire-memberships]
verify_jwt = false

# PayU posts here (browser redirect / server webhook), not a user login.
# Both verify PayU's hash and re-check with PayU's verify API.
[functions.payu-return]
verify_jwt = false

[functions.payu-webhook]
verify_jwt = false
